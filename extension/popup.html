<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>知乎回答长图</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><img src="icons/icon48.png" width="40" height="40" alt=""><div><h1>知乎回答长图</h1><p>jasonLi · v1.9.1</p></div></header>
  <p>导出多条或单条回答。支持 PNG、SVG、HTML、PDF、WebP，请在知乎页面选择格式。</p>
  <form id="settings">
    <label for="count">默认回答数</label><input id="count" type="number" min="1" step="1" required value="10">
    <label for="scale">默认清晰度</label><select id="scale"><option value="1">1倍</option><option value="2" selected>2倍 · 推荐</option><option value="3">3倍</option><option value="4">4倍</option></select>
    <button type="submit">保存默认设置</button>
  </form>
  <button type="button" id="show" class="secondary">显示当前页面导出面板</button>
  <button type="button" id="installation" class="secondary">安装与更新指南</button>
  <button type="button" id="updates" class="secondary">查看最新发布</button>
  <p id="status" role="status" aria-live="polite"></p>
  <footer>保存后刷新知乎生效。开发者模式更新需下载新包、覆盖原目录并重新加载扩展。仅处理当前账号可见的内容。</footer>
  <script src="popup.js"></script>
</body>
</html>
